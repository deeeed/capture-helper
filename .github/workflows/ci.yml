name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build and test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Show tool versions
        run: |
          swift --version
          node --version
          npm --version
      - name: Swift build
        run: swift build -c release --arch arm64 --arch x86_64
      - name: Swift test
        run: swift test
      - name: Build npm native artifact
        run: npm run build:native
      - name: CLI smoke
        run: |
          node bin/capture-helper.js version
          node bin/capture-helper.js doctor --json >/tmp/capture-helper-doctor.json || true
          python3 -m json.tool /tmp/capture-helper-doctor.json >/dev/null
          # GitHub-hosted runners may not grant Screen Recording permission, so list is opportunistic.
          node bin/capture-helper.js list --json >/tmp/capture-helper-windows.json || true
          if [ -s /tmp/capture-helper-windows.json ]; then python3 -m json.tool /tmp/capture-helper-windows.json >/dev/null; fi
      - name: JavaScript tests
        run: npm run test:js
      - name: npm pack dry run
        run: npm pack --dry-run
      - name: Report codesign state
        run: |
          codesign -dv --verbose=2 native/capture-helper
          spctl -a -vv native/capture-helper || true

  npm-install-smoke:
    name: npm pack install without Swift
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build release artifact for pack
        run: npm run build:native
      - name: Pack and install globally without Swift on PATH
        run: |
          set -euo pipefail
          stub_bin="$(mktemp -d)"
          printf '#!/bin/sh\necho "swift disabled for smoke test" >&2\nexit 1\n' > "${stub_bin}/swift"
          chmod +x "${stub_bin}/swift"
          export PATH="${stub_bin}:${PATH}"
          swift --version && { echo "expected stub swift to run for smoke test" >&2; exit 1; }
          npm pack
          tgz="$(ls -1 siteed-capture-helper-*.tgz | head -1)"
          npm install -g "./${tgz}"
          capture-helper version
          capture-helper doctor --json | python3 -m json.tool >/dev/null
      - name: Broken-binary doctor teaches when native binary is removed
        run: |
          set -euo pipefail
          stub_bin="$(mktemp -d)"
          printf '#!/bin/sh\nexit 1\n' > "${stub_bin}/swift"
          chmod +x "${stub_bin}/swift"
          export PATH="${stub_bin}:${PATH}"
          pkg_root="$(npm root -g)/@siteed/capture-helper"
          mv "${pkg_root}/native/capture-helper" "${pkg_root}/native/capture-helper.bak"
          if capture-helper doctor --json; then
            echo "expected doctor to fail when native binary is missing" >&2
            exit 1
          fi
          BROKEN_JSON="$(capture-helper doctor --json 2>/dev/null || true)"
          printf '%s' "$BROKEN_JSON" | python3 -c '
          import json, sys
          doc = json.load(sys.stdin)
          assert doc["ok"] is False
          assert "native_binary_missing" in doc["summary"]["requiredFailureCodes"]
          assert doc["teach"]["brew"] == "brew install deeeed/tap/capture-helper"
          '