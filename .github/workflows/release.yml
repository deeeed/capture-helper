name: Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    name: Build release binary
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build release
        run: |
          swift build -c release
          mkdir -p dist
          cp .build/release/capture-helper dist/capture-helper-darwin-arm64
          shasum -a 256 dist/capture-helper-darwin-arm64 > dist/SHA256SUMS
      - name: Upload GitHub release assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/capture-helper-darwin-arm64
            dist/SHA256SUMS
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: capture-helper-darwin-arm64
          path: dist/

  npm:
    name: Publish npm package
    runs-on: macos-14
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Build native package artifact
        run: npm run build:native
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          printf "//registry.npmjs.org/:_authToken=%s\nregistry=https://registry.npmjs.org/\nalways-auth=true\n" "$NODE_AUTH_TOKEN" > ~/.npmrc
          npm whoami
          npm publish --access public

  homebrew:
    name: Update Homebrew tap
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Skip when tap token is not configured
        if: env.HOMEBREW_TAP_TOKEN == ''
        run: echo "HOMEBREW_TAP_TOKEN secret is not configured; skipping tap update."
      - name: Download release artifact
        if: env.HOMEBREW_TAP_TOKEN != ''
        uses: actions/download-artifact@v4
        with:
          name: capture-helper-darwin-arm64
          path: dist
      - name: Checkout tap
        if: env.HOMEBREW_TAP_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: deeeed/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
      - name: Update formula
        if: env.HOMEBREW_TAP_TOKEN != ''
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          sha="$(shasum -a 256 dist/capture-helper-darwin-arm64 | awk '{print $1}')"
          formula="homebrew-tap/Formula/capture-helper.rb"
          python3 - "$formula" "$version" "$sha" <<'PY'
          import re
          import sys
          from pathlib import Path

          formula = Path(sys.argv[1])
          version = sys.argv[2]
          sha = sys.argv[3]
          text = formula.read_text()
          text = re.sub(
              r'releases/download/v[0-9]+\.[0-9]+\.[0-9]+/capture-helper-darwin-arm64',
              f'releases/download/v{version}/capture-helper-darwin-arm64',
              text,
          )
          text = re.sub(r'version "[^"]+"', f'version "{version}"', text)
          text = re.sub(r'sha256 "[0-9a-f]{64}"', f'sha256 "{sha}"', text)
          text = re.sub(r"assert_match '\"[0-9]+\.[0-9]+\.[0-9]+\"'", f"assert_match '\"{version}\"'", text)
          formula.write_text(text)
          PY
          ruby -c "$formula"
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/capture-helper.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date."
          else
            git commit -m "build: update capture-helper to ${version}"
            git push
          fi
