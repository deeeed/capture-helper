name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    name: Build release binary
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build release
        run: |
          swift build -c release
          mkdir -p dist
          cp .build/release/capture-helper dist/capture-helper-darwin-arm64
          shasum -a 256 dist/capture-helper-darwin-arm64 > dist/SHA256SUMS
      - name: Upload GitHub release assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/capture-helper-darwin-arm64
            dist/SHA256SUMS
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: capture-helper-darwin-arm64
          path: dist/

  npm:
    name: Publish npm package
    runs-on: macos-14
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Build native package artifact
        run: npm run build:native
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          printf "//registry.npmjs.org/:_authToken=%s\nregistry=https://registry.npmjs.org/\nalways-auth=true\n" "$NODE_AUTH_TOKEN" > ~/.npmrc
          npm whoami
          npm publish --access public
